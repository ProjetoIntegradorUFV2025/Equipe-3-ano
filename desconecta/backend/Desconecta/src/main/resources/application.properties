spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/desconecta}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Porta: o Render (e outros hosts) informam a porta pela variavel PORT
server.port=${PORT:8080}

# Pool de conexoes pequeno: bancos gratuitos limitam o numero de conexoes
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
