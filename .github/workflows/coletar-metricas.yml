name: Coletar Métricas da Sprint

on:
  workflow_dispatch:
    inputs:
      sprint_number:
        description: 'Número da Sprint'
        required: true
        type: number
      sprint_start:
        description: 'Data de início (YYYY-MM-DD)'
        required: true
        type: string
      sprint_end:
        description: 'Data de fim (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  coletar-metricas:
    runs-on: ubuntu-latest
    
    # 🔐 DAR PERMISSÕES EXTRA PARA O GITHUB_TOKEN
    permissions:
      contents: write
      issues: read
      pull-requests: read
      repository-projects: read
    
    steps:
    - name: Checkout código com PAT
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Instalar dependências
      run: |
        pip install requests pandas
    
    - name: Executar coleta de métricas
      env:
        # 🔥 USAR PAT_TOKEN em vez de GITHUB_TOKEN
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: |
        echo "Repositório: $REPOSITORY"
        python coletar_metricas.py \
          --sprint-number ${{ github.event.inputs.sprint_number }} \
          --sprint-start ${{ github.event.inputs.sprint_start }} \
          --sprint-end ${{ github.event.inputs.sprint_end }}
    
    - name: Commit e push dos resultados
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add metricas/
        git commit -m "Atualizar métricas da sprint ${{ github.event.inputs.sprint_number }}" || echo "Sem alterações para commitar"
        git push https://$PAT_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}