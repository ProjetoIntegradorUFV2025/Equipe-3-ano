name: Coletar Métricas da Sprint

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:
    inputs:
      sprint_number:
        description: 'Número da Sprint'
        required: true
        type: number
      sprint_start:
        description: 'Data de início (YYYY-MM-DD)'
        required: true
        type: string
      sprint_end:
        description: 'Data de fim (YYYY-MM-DD)'
        required: true
        type: string

jobs:
  coletar-metricas:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Importante: fetch todo o histórico
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Instalar dependências
      run: |
        pip install requests pandas
    
    - name: Executar coleta de métricas
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python coletar_metricas.py \
          --sprint-number ${{ github.event.inputs.sprint_number }} \
          --sprint-start ${{ github.event.inputs.sprint_start }} \
          --sprint-end ${{ github.event.inputs.sprint_end }}
    
    - name: Commit e push dos resultados
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add metricas/
        git commit -m "Atualizar métricas da sprint ${{ github.event.inputs.sprint_number }}"
        
        # SOLUÇÃO DEFINITIVA - Configurar a URL remota com autenticação
        git remote set-url origin https://${{ github.actor }}:$PAT_TOKEN@github.com/${{ github.repository }}.git
        git push origin HEAD:main
            