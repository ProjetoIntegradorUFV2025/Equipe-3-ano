name: Notificacao PR e Issues

on:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
    branches: 
      - '**'
  issues:
    types: [opened, closed, reopened, assigned]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # =======================
      # 🔔 NOTIFICAÇÕES DE PRs
      # =======================
      - name: Notificar PR aberto/reaberto
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            🎉 **NOVO PR ABERTO**
            **Título:** ${{ github.event.pull_request.title }}
            👤 **Autor:** ${{ github.event.pull_request.user.login }}
            📌 **De:** ${{ github.event.pull_request.head.ref }} 
            🎯 **Para:** ${{ github.event.pull_request.base.ref }}
            🔗 **Link:** ${{ github.event.pull_request.html_url }}
            📊 **Estado:** ${{ github.event.pull_request.state }}

      - name: Notificar PR pronto para revisão
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            📋 **PR PRONTO PARA REVISÃO**
            **Título:** ${{ github.event.pull_request.title }}
            👤 **Autor:** ${{ github.event.pull_request.user.login }}
            📌 **De:** ${{ github.event.pull_request.head.ref }}
            🎯 **Para:** ${{ github.event.pull_request.base.ref }}
            🔗 **Link:** ${{ github.event.pull_request.html_url }}

      - name: Notificar PR mesclado
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            🚀 **PR MERGEADO COM SUCESSO**
            **Título:** ${{ github.event.pull_request.title }}
            👤 **Autor:** ${{ github.event.pull_request.user.login }}
            📌 **De:** ${{ github.event.pull_request.head.ref }}
            🎯 **Para:** ${{ github.event.pull_request.base.ref }}
            🔗 **Link:** ${{ github.event.pull_request.html_url }}

      - name: Notificar PR fechado (não mesclado)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && (github.event.pull_request.merged == false || github.event.pull_request.merged == null)
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            ❌ **PR FECHADO (NÃO MERGEADO)**
            **Título:** ${{ github.event.pull_request.title }}
            👤 **Autor:** ${{ github.event.pull_request.user.login }}
            📌 **De:** ${{ github.event.pull_request.head.ref }}
            🎯 **Para:** ${{ github.event.pull_request.base.ref }}
            🔗 **Link:** ${{ github.event.pull_request.html_url }}

      # =======================
      # 🔔 NOTIFICAÇÕES DE ISSUES
      # =======================
      - name: Notificar Issue aberta
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            📝 **NOVA ISSUE ABERTA**
            **Título:** ${{ github.event.issue.title }}
            👤 **Autor:** ${{ github.event.issue.user.login }}
            🔗 **Link:** ${{ github.event.issue.html_url }}
            📊 **Estado:** ${{ github.event.issue.state }}

      - name: Notificar Issue reaberta
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            ♻️ **ISSUE REABERTA**
            **Título:** ${{ github.event.issue.title }}
            👤 **Autor:** ${{ github.event.issue.user.login }}
            🔗 **Link:** ${{ github.event.issue.html_url }}

      - name: Notificar Issue fechada
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            ✅ **ISSUE FECHADA**
            **Título:** ${{ github.event.issue.title }}
            👤 **Autor:** ${{ github.event.issue.user.login }}
            🔗 **Link:** ${{ github.event.issue.html_url }}

      - name: Notificar Issue atribuída
        if: github.event_name == 'issues' && github.event.action == 'assigned'
        uses: appleboy/discord-action@master
        with:
          webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          username: "GitHub Bot"
          message: |
            🎯 **ISSUE ATRIBUÍDA**
            **Título:** ${{ github.event.issue.title }}
            👤 **Responsável:** ${{ github.event.assignee.login }}
            🔗 **Link:** ${{ github.event.issue.html_url }}
