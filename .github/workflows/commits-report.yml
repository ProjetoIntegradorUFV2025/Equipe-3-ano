name: Contar commits por integrante

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
      until:
        description: "Data final (YYYY-MM-DD)"
        required: true
        default: "2025-10-11"

jobs:
  contar-commits:
    runs-on: ubuntu-latest
    
    # 🔐 DAR PERMISSÕES EXTRA PARA O GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Checkout código com PAT
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Instalar dependências
        run: |
          pip install requests

      - name: Gerar relatório de commits
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          echo "🔍 Gerando relatório de commits entre $SINCE e $UNTIL..."
          
          # Criar pasta metricas se não existir
          mkdir -p metricas
          
          # Gerar nome do arquivo com timestamp
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          export FILENAME="metricas/commits_${SINCE}_${UNTIL}_${TIMESTAMP}.md"
          
          python3 << 'PYTHON_SCRIPT'
          import os
          import requests
          from datetime import datetime
          from collections import defaultdict
          
          # Configurações
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPOSITORY']
          since = os.environ['SINCE']
          until = os.environ['UNTIL']
          filename = os.environ['FILENAME']
          
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          # 1. Buscar commits no período especificado
          print(f"🔍 Buscando commits de {since} a {until}...")
          page = 1
          total_commits = 0
          contagem = defaultdict(int)
          user_to_name = {}
          
          while True:
              commits_url = f'https://api.github.com/repos/{repo}/commits'
              params = {
                  'since': f'{since}T00:00:00Z',
                  'until': f'{until}T23:59:59Z',
                  'per_page': 100,
                  'page': page
              }
              
              response = requests.get(commits_url, headers=headers, params=params)
              
              if response.status_code != 200:
                  print(f"⚠️ Erro na API: {response.status_code}")
                  break
              
              commits = response.json()
              
              if not commits or not isinstance(commits, list):
                  break
              
              for commit in commits:
                  author = commit.get('author')
                  commit_author = commit.get('commit', {}).get('author', {})
                  
                  if author and author.get('login'):
                      username = author['login']
                      contagem[username] += 1
                      total_commits += 1
                      
                      # Pegar o nome real do commit ou do perfil
                      if commit_author.get('name'):
                          user_to_name[username] = commit_author['name']
                      elif not username in user_to_name:
                          user_to_name[username] = username
              
              # Se retornou menos que 100, é a última página
              if len(commits) < 100:
                  break
              
              page += 1
              
              # Limitar a 20 páginas para evitar timeout
              if page > 20:
                  break
          
          print(f"✅ Total de commits processados: {total_commits}")
          print(f"✅ Autores encontrados: {len(contagem)}")
          
          # 2. Buscar todos os colaboradores do repositório
          print("📋 Buscando colaboradores do repositório...")
          page = 1
          todos_colaboradores = []
          
          while True:
              colaboradores_url = f'https://api.github.com/repos/{repo}/collaborators'
              params = {'per_page': 100, 'page': page}
              
              response = requests.get(colaboradores_url, headers=headers, params=params)
              
              if response.status_code != 200:
                  print(f"⚠️ Erro ao buscar colaboradores: {response.status_code}")
                  break
              
              colaboradores = response.json()
              
              if not colaboradores or not isinstance(colaboradores, list):
                  break
              
              todos_colaboradores.extend(colaboradores)
              
              if len(colaboradores) < 100:
                  break
              
              page += 1
          
          print(f"✅ Encontrados {len(todos_colaboradores)} colaboradores")
          
          # Adicionar colaboradores que não fizeram commits
          for colab in todos_colaboradores:
              username = colab['login']
              if username not in contagem:
                  contagem[username] = 0
                  user_to_name[username] = username
          
          # 3. Gerar relatório em Markdown
          linhas = []
          for username in sorted(contagem.keys(), key=lambda x: contagem[x], reverse=True):
              nome_exibicao = user_to_name.get(username, username)
              total = contagem[username]
              linhas.append(f"| {nome_exibicao} (@{username}) | {total} |")
          
          markdown = f"""# 📊 Relatório de Commits
          **Período:** {since} → {until}  
          **Total de Commits:** {total_commits}  
          **Colaboradores:** {len(todos_colaboradores)}
          
          | Autor | Commits |
          |--------|----------|
          {chr(10).join(linhas)}
          
          ---
          *Relatório gerado em {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}*
          """
          
          # Salvar arquivo
          with open(filename, 'w', encoding='utf-8') as f:
              f.write(markdown)
          
          print(f"✅ Relatório gerado: {filename}")
          PYTHON_SCRIPT
          
          echo ""
          echo "📄 Conteúdo do relatório:"
          cat "$FILENAME"

      - name: Commit e push dos resultados
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add metricas/
          git commit -m "📝 Adiciona relatório de commits (${{ github.event.inputs.since }} → ${{ github.event.inputs.until }})" || echo "Sem alterações para commitar"
          git push https://$PAT_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}