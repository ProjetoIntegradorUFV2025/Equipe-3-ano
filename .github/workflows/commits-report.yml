name: Contar commits por integrante

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
      until:
        description: "Data final (YYYY-MM-DD)"
        required: true
        default: "2025-10-11"

jobs:
  contar-commits:
    runs-on: ubuntu-latest
    
    # 🔐 DAR PERMISSÕES EXTRA PARA O GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Checkout código com PAT
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Instalar dependências
        run: |
          pip install requests

      - name: Gerar relatório de commits
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          echo "🔍 Gerando relatório de commits entre $SINCE e $UNTIL..."
          
          # Criar pasta metricas se não existir
          mkdir -p metricas
          
          # Gerar nome do arquivo com timestamp
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          export FILENAME="metricas/commits_${SINCE}_${UNTIL}_${TIMESTAMP}.md"
          
          python3 << 'PYTHON_SCRIPT'
          import os
          import subprocess
          import requests
          from datetime import datetime
          from collections import defaultdict
          
          # Configurações
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPOSITORY']
          since = os.environ['SINCE']
          until = os.environ['UNTIL']
          filename = os.environ['FILENAME']
          
          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          # 1. Buscar colaboradores diretos do repositório (com permissão push)
          print("📋 Buscando colaboradores do repositório...")
          colaboradores_url = f'https://api.github.com/repos/{repo}/collaborators'
          params = {'affiliation': 'direct', 'per_page': 100}
          
          response = requests.get(colaboradores_url, headers=headers, params=params)
          
          if response.status_code != 200:
              print(f"⚠️ Erro ao buscar colaboradores: {response.status_code}")
              print(f"Response: {response.text}")
              colaboradores_api = []
          else:
              colaboradores_api = response.json()
          
          print(f"✅ Encontrados {len(colaboradores_api)} colaboradores diretos na API")
          
          # Criar set de usernames dos colaboradores
          colaboradores_usernames = {colab['login'].lower() for colab in colaboradores_api}
          
          # 2. Buscar commits usando git log (mais confiável)
          print(f"🔍 Buscando commits de {since} a {until}...")
          
          # Executar git log para pegar autor e email
          cmd = [
              'git', 'log',
              f'--since={since}T00:00:00',
              f'--until={until}T23:59:59',
              '--all',
              '--format=%ae|%an|%aE'
          ]
          
          result = subprocess.run(cmd, capture_output=True, text=True)
          commits_raw = result.stdout.strip().split('\n')
          
          # Contar commits por email
          commits_por_email = defaultdict(int)
          email_to_name = {}
          
          for line in commits_raw:
              if not line:
                  continue
              parts = line.split('|')
              if len(parts) >= 2:
                  email = parts[0].lower()
                  name = parts[1]
                  commits_por_email[email] += 1
                  email_to_name[email] = name
          
          print(f"✅ Total de commits encontrados: {sum(commits_por_email.values())}")
          print(f"✅ Autores únicos: {len(commits_por_email)}")
          
          # 3. Mapear emails para usernames do GitHub
          print("🔗 Mapeando emails para usernames...")
          contagem_final = defaultdict(int)
          user_to_display_name = {}
          
          # Para cada colaborador, buscar seus emails
          for colab in colaboradores_api:
              username = colab['login']
              
              # Buscar emails do usuário via API
              user_url = f'https://api.github.com/users/{username}'
              user_response = requests.get(user_url, headers=headers)
              
              if user_response.status_code == 200:
                  user_data = user_response.json()
                  user_email = user_data.get('email', '').lower() if user_data.get('email') else None
                  user_name = user_data.get('name', username)
                  
                  # Inicializar com 0
                  contagem_final[username] = 0
                  user_to_display_name[username] = user_name
                  
                  # Verificar se algum email nos commits bate
                  for email, count in commits_por_email.items():
                      # Verifica se o email contém o username ou vice-versa
                      if user_email and email == user_email:
                          contagem_final[username] += count
                      elif username.lower() in email:
                          contagem_final[username] += count
                      elif email.split('@')[0].lower() == username.lower():
                          contagem_final[username] += count
          
          # Adicionar commits de emails que não foram mapeados (se forem colaboradores)
          for email, count in commits_por_email.items():
              username_from_email = email.split('@')[0]
              
              # Verificar se é um colaborador conhecido
              if username_from_email.lower() in colaboradores_usernames:
                  if username_from_email not in contagem_final:
                      contagem_final[username_from_email] = count
                      user_to_display_name[username_from_email] = email_to_name.get(email, username_from_email)
          
          total_commits = sum(contagem_final.values())
          
          # 4. Gerar relatório em Markdown
          linhas = []
          for username in sorted(contagem_final.keys(), key=lambda x: contagem_final[x], reverse=True):
              nome_exibicao = user_to_display_name.get(username, username)
              total = contagem_final[username]
              linhas.append(f"| {nome_exibicao} (@{username}) | {total} |")
          
          markdown = f"""# 📊 Relatório de Commits
          **Período:** {since} → {until}  
          **Total de Commits:** {total_commits}  
          **Colaboradores:** {len(colaboradores_api)}
          
          | Autor | Commits |
          |--------|----------|
          {chr(10).join(linhas)}
          
          ---
          *Relatório gerado em {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}*
          """
          
          # Salvar arquivo
          with open(filename, 'w', encoding='utf-8') as f:
              f.write(markdown)
          
          print(f"✅ Relatório gerado: {filename}")
          PYTHON_SCRIPT
          
          echo ""
          echo "📄 Conteúdo do relatório:"
          cat "$FILENAME"

      - name: Commit e push dos resultados
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add metricas/
          git commit -m "📝 Adiciona relatório de commits (${{ github.event.inputs.since }} → ${{ github.event.inputs.until }})" || echo "Sem alterações para commitar"
          git push https://$PAT_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}