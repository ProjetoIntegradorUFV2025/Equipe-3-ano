name: Contar commits por integrante

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
      until:
        description: "Data final (YYYY-MM-DD)"
        required: true
        default: "2025-10-11"

jobs:
  contar-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar relatório de commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          echo "🔍 Gerando relatório de commits de $OWNER/$REPO entre $SINCE e $UNTIL..."

          node - <<'EOF'
          import { Octokit } from "https://esm.sh/@octokit/rest";
          import fs from "fs";

          const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
          const owner = process.env.OWNER;
          const repo = process.env.REPO;
          const since = process.env.SINCE;
          const until = process.env.UNTIL;

          const contagem = {};
          const perPage = 100;
          let page = 1;

          const buscar = async () => {
            while (true) {
              const { data } = await octokit.repos.listCommits({
                owner, repo, since, until, per_page: perPage, page
              });
              if (data.length === 0) break;
              for (const commit of data) {
                const autor = commit.commit.author?.name || commit.author?.login || "Desconhecido";
                contagem[autor] = (contagem[autor] || 0) + 1;
              }
              page++;
            }
          };

          await buscar();

          const linhas = Object.entries(contagem)
            .sort((a, b) => b[1] - a[1])
            .map(([autor, total]) => `| ${autor} | ${total} |`)
            .join("\n");

          const markdown = `# 📊 Relatório de Commits
**Período:** ${since} → ${until}

| Autor | Commits |
|--------|----------|
${linhas}`;

          fs.writeFileSync("commits-report.md", markdown);
          console.log("✅ Relatório gerado: commits-report.md");
          EOF

      - name: Commitar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add commits-report.md
          git commit -m "📝 Atualiza relatório de commits"
          git push
