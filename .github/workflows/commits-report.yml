name: Contar commits por integrante

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
      until:
        description: "Data final (YYYY-MM-DD)"
        required: true
        default: "2025-10-11"

jobs:
  contar-commits:
    runs-on: ubuntu-latest
    
    # 🔐 DAR PERMISSÕES EXTRA PARA O GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - name: Checkout código com PAT
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Gerar relatório de commits
        env:
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          echo "🔍 Gerando relatório de commits entre $SINCE e $UNTIL..."
          
          # Criar pasta metricas se não existir
          mkdir -p metricas
          
          # Gerar nome do arquivo com timestamp
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILENAME="metricas/commits_${SINCE}_${UNTIL}_${TIMESTAMP}.md"
          
          # Gera relatório usando git log
          git log --since="$SINCE" --until="$UNTIL" --pretty=format:"%an" | \
            sort | uniq -c | sort -rn | \
            awk -v since="$SINCE" -v until="$UNTIL" '
              BEGIN {
                print "# 📊 Relatório de Commits"
                print "**Período:** " since " → " until
                print ""
                print "| Autor | Commits |"
                print "|--------|----------|"
              }
              {
                printf "| %s | %d |\n", substr($0, index($0,$2)), $1
              }
            ' > "$FILENAME"
          
          echo "✅ Relatório gerado: $FILENAME"
          cat "$FILENAME"

      - name: Commit e push dos resultados
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add metricas/
          git commit -m "📝 Adiciona relatório de commits (${{ github.event.inputs.since }} → ${{ github.event.inputs.until }})" || echo "Sem alterações para commitar"
          git push https://$PAT_TOKEN@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}