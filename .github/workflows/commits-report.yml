name: Contar commits por integrante

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
      until:
        description: "Data final (YYYY-MM-DD)"
        required: true
        default: "2025-10-11"

jobs:
  contar-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar relatório de commits
        env:
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
        run: |
          echo "🔍 Gerando relatório de commits entre $SINCE e $UNTIL..."
          
          # Gera relatório usando git log
          git log --since="$SINCE" --until="$UNTIL" --pretty=format:"%an" | \
            sort | uniq -c | sort -rn | \
            awk -v since="$SINCE" -v until="$UNTIL" '
              BEGIN {
                print "# 📊 Relatório de Commits"
                print "**Período:** " since " → " until
                print ""
                print "| Autor | Commits |"
                print "|--------|----------|"
              }
              {
                printf "| %s | %d |\n", substr($0, index($0,$2)), $1
              }
            ' > commits-report.md
          
          echo "✅ Relatório gerado: commits-report.md"
          cat commits-report.md

      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add commits-report.md
          git diff --staged --quiet || git commit -m "📝 Atualiza relatório de commits"
          git push