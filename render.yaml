# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: desconecta
    runtime: docker
    plan: free
    dockerfilePath: ./desconecta/Dockerfile.render
    dockerContext: ./desconecta
    buildFilter:
      paths:
        - desconecta/**
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false   # preencher no painel: URL JDBC do banco (Aiven)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
